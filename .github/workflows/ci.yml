name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            experimental: false
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            experimental: false
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg & fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install ffmpeg
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: '22'
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: ${{ matrix.experimental }}
      - name: test
        run: cargo test --workspace
        continue-on-error: ${{ matrix.experimental }}
      - name: Build integration binaries
        if: runner.os != 'Windows'
        run: cargo build --workspace
      - name: Browser, capture/download and recording regressions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == Linux ]]; then
            # Avoid Chromium snap launcher stubs; use the runner's actual Chrome.
            export AP_TEST_CHROME="$(command -v google-chrome)"
            export AP_BROWSER_CHROME="${AP_TEST_CHROME}"
          fi
          node --test --test-concurrency=1 extension/*.test.mjs tests/*.test.mjs host/src/recording/*.test.mjs
      - name: build release
        run: cargo build --workspace --release
        continue-on-error: ${{ matrix.experimental }}
