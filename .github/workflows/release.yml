name: Release

# Production release channel = main.
# After CI succeeds on main, publish/update GitHub Release tagged v{Cargo.toml version}.
# Explicit v* tag pushes still build and publish that tag.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm trusted publishing via OIDC

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve version
    if: >
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tag + sha
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            SHA="${GITHUB_SHA}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' \
              Cargo.toml | head -1)
            if [ -z "$VERSION" ]; then
              echo "could not read workspace version from Cargo.toml" >&2
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} @ ${SHA}"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" \
            >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="ap-browser-${VERSION}-${{ matrix.target }}"
          mkdir -p "${STAGE}/bin" "${STAGE}/extension" "${STAGE}/install"
          cp "target/${{ matrix.target }}/release/ap-browser" "${STAGE}/bin/"
          cp "target/${{ matrix.target }}/release/ap-browser-host" "${STAGE}/bin/"
          cp "target/${{ matrix.target }}/release/ap-browser-bridge" \
            "${STAGE}/bin/"
          cp -R extension "${STAGE}/"
          cp install/com.apbrowser.connect.json "${STAGE}/install/"
          cp install/install.sh "${STAGE}/install/"
          cp install/install_guide.pdf "${STAGE}/install/"
          cp README.md LICENSE "${STAGE}/"
          tar czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          $STAGE = "ap-browser-$env:VERSION-${{ matrix.target }}"
          $SRC = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "$STAGE/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$STAGE/install" | Out-Null
          Copy-Item "$SRC/ap-browser.exe" "$STAGE/bin/"
          Copy-Item "$SRC/ap-browser-host.exe" "$STAGE/bin/"
          Copy-Item "$SRC/ap-browser-bridge.exe" "$STAGE/bin/"
          Copy-Item -Recurse "extension" "$STAGE/extension"
          Copy-Item "install/com.apbrowser.connect.json" "$STAGE/install/"
          Copy-Item "install/install.ps1" "$STAGE/install/"
          Copy-Item "install/install_guide.pdf" "$STAGE/install/"
          Copy-Item "README.md" "$STAGE/"
          Copy-Item "LICENSE" "$STAGE/"
          Compress-Archive -Path "$STAGE/*" -DestinationPath "$STAGE.zip"
          $hash = (Get-FileHash "$STAGE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $STAGE.zip" | Out-File -Encoding ascii "$STAGE.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create extension zip
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          (cd extension && zip -r "../ap-browser-extension-${VERSION}.zip" .)

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: ${{ needs.meta.outputs.tag }}
          make_latest: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            ap-browser-extension-*.zip

  npm-publish:
    name: Publish to npm
    if: >
      github.event_name == 'push'
      || github.event.workflow_run.conclusion == 'success'
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Assemble binaries + publish
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Diagnose the OIDC subject npm will match against the Trusted
          # Publisher config (owner/repo/ref/environment).
          python3 npm/scripts/oidc-subject.py
          BASE="${TAG#v}"
          # npm versions are immutable: bump patch if the tag version is taken.
          VERSION="$BASE"
          i=1
          while npm view ap-browser-connect@"${VERSION}" version \
            >/dev/null 2>&1; do
            VERSION="${BASE%.*}.$(( ${BASE##*.} + i ))"
            i=$((i + 1))
          done
          (cd npm && npm pkg set version="${VERSION}")
          bash npm/build.sh "$BASE"
          # OIDC trusted publishing: no NODE_AUTH_TOKEN, requires the npm
          # Trusted Publisher configured for this repo (id-token: write).
          (cd npm && npm publish)
          echo "✓ Published ap-browser-connect@${VERSION}"
