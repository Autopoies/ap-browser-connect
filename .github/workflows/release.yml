name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm trusted publishing via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout (full history + tags for version resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every push to main is a release. Version rule:
      #   next = max(Cargo.toml version, latest v* tag + one patch)
      # Manual minor/major bumps win by raising Cargo.toml; otherwise the tag
      # auto-advances so consecutive pushes never pile onto one release. If
      # Cargo.toml lags, it is committed back to main with [skip ci] so the
      # built binaries' `--version` matches the tag (no drift).
      - name: Resolve tag + sha (auto-bump, commit-back on lag)
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            SHA="${GITHUB_SHA}"
          else
            git fetch --tags --force origin
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' \
              Cargo.toml | head -1)
            if [ -z "$VERSION" ]; then
              echo "could not read workspace version from Cargo.toml" >&2
              exit 1
            fi
            LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
            if [ -n "${LATEST}" ]; then
              NEXT_PATCH="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
              TAG_BODY=$(printf '%s\n%s\n' "${VERSION}" "${NEXT_PATCH}" \
                | sort -V | tail -1)
            else
              TAG_BODY="${VERSION}"
            fi
            TAG="v${TAG_BODY}"
            SHA="${GITHUB_SHA}"
            if [ "${VERSION}" != "${TAG_BODY}" ]; then
              git config user.name "github-actions[bot]"
              git config email \
                "41898282+github-actions[bot]@users.noreply.github.com"
              sed -i "s/^version = \"[^\"]*\"/version = \"${TAG_BODY}\"/" \
                Cargo.toml
              git commit -am "chore(release): ${TAG} [skip ci]"
              # Pushes made with GITHUB_TOKEN never retrigger workflows;
              # [skip ci] is the belt-and-braces. If branch protection blocks
              # the push, degrade gracefully: tag the merge SHA as-is.
              if git push origin HEAD:main; then
                SHA=$(git rev-parse HEAD)
                echo "bumped Cargo.toml to ${TAG_BODY}, tagged bump commit"
              else
                git reset --hard "${GITHUB_SHA}"
                echo "::warning::commit-back blocked; releasing ${TAG}" \
                  "with Cargo.toml still at ${VERSION}"
              fi
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} @ ${SHA}"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            zig: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install zig + cargo-zigbuild (Linux musl)
        if: matrix.zig == true
        run: |
          ZIG_URL="https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz"
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          tar -C /opt -xf /tmp/zig.tar.xz
          echo "/opt/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Build release
        run: >
          cargo ${{ matrix.zig && 'zigbuild' || 'build' }}
          --workspace --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="ap-browser-${VERSION}-${{ matrix.target }}"
          mkdir -p "${STAGE}/bin" "${STAGE}/extension" "${STAGE}/install"
          cp "target/${{ matrix.target }}/release/ap-browser" "${STAGE}/bin/"
          cp "target/${{ matrix.target }}/release/ap-browser-host" \
            "${STAGE}/bin/"
          cp "target/${{ matrix.target }}/release/ap-browser-bridge" \
            "${STAGE}/bin/"
          cp -R extension "${STAGE}/"
          cp install/com.apbrowser.connect.json "${STAGE}/install/"
          cp install/install.sh "${STAGE}/install/"
          cp install/install_guide.pdf "${STAGE}/install/"
          cp README.md LICENSE "${STAGE}/"
          tar czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          $STAGE = "ap-browser-$env:VERSION-${{ matrix.target }}"
          $SRC = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "$STAGE/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$STAGE/install" | Out-Null
          Copy-Item "$SRC/ap-browser.exe" "$STAGE/bin/"
          Copy-Item "$SRC/ap-browser-host.exe" "$STAGE/bin/"
          Copy-Item "$SRC/ap-browser-bridge.exe" "$STAGE/bin/"
          Copy-Item -Recurse "extension" "$STAGE/extension"
          Copy-Item "install/com.apbrowser.connect.json" "$STAGE/install/"
          Copy-Item "install/install.ps1" "$STAGE/install/"
          Copy-Item "install/install_guide.pdf" "$STAGE/install/"
          Copy-Item "README.md" "$STAGE/"
          Copy-Item "LICENSE" "$STAGE/"
          Compress-Archive -Path "$STAGE/*" -DestinationPath "$STAGE.zip"
          $hash = (Get-FileHash "$STAGE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $STAGE.zip" | Out-File -Encoding ascii "$STAGE.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create extension zip
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          (cd extension && zip -r "../ap-browser-extension-${VERSION}.zip" .)

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: ${{ needs.meta.outputs.tag }}
          make_latest: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            ap-browser-extension-*.zip

  npm-publish:
    name: Publish to npm
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # npm trusted publishing requires Node >= 22.14.0 (docs.npmjs.com/
          # trusted-publishers). NOTE: no registry-url — setup-node would write
          # GITHUB_TOKEN as the npm auth token into .npmrc, which shadows OIDC
          # trusted publishing and makes npm publish fail with E404.

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest --force

      - name: Assemble binaries + publish
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="${TAG#v}"
          # npm versions are immutable: bump patch if the tag version is taken.
          VERSION="$BASE"
          i=1
          while npm view ap-browser-connect@"${VERSION}" version \
            >/dev/null 2>&1; do
            VERSION="${BASE%.*}.$(( ${BASE##*.} + i ))"
            i=$((i + 1))
          done
          (cd npm && npm pkg set version="${VERSION}")
          bash npm/build.sh "$BASE"
          # OIDC trusted publishing: no NODE_AUTH_TOKEN, requires the npm
          # Trusted Publisher configured for this repo (id-token: write).
          (cd npm && npm publish)
          echo "✓ Published ap-browser-connect@${VERSION}"
