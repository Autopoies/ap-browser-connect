<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="icon-bg-browser" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B343B" />
      <stop offset="1" stop-color="#1A2125" />
    </linearGradient>
    <linearGradient id="browser-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AA788" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#11161A" />
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#icon-bg-browser)" />

  <!-- Browser Window Frame -->
  <rect x="176" y="176" width="672" height="672" rx="44" fill="#161D22" stroke="url(#browser-stroke)" stroke-width="6" />
  <path d="M 176 220 C 176 195, 195 176, 220 176 L 804 176 C 829 176, 848 195, 848 220 L 848 256 L 176 256 Z" fill="#0F1418" />
  <line x1="176" y1="256" x2="848" y2="256" stroke="#2D3840" stroke-width="2" />

  <!-- Dots -->
  <circle cx="224" cy="216" r="10" fill="#EF4444" />
  <circle cx="256" cy="216" r="10" fill="#F59E0B" />
  <circle cx="288" cy="216" r="10" fill="#10B981" />

  <!-- Address Bar -->
  <rect x="336" y="198" width="460" height="36" rx="18" fill="#222B32" stroke="#33414D" stroke-width="1.5" />
  <circle cx="360" cy="216" r="6" fill="#5AA788" />

  <!-- Classic Autopoies Green Mark in Browser -->
  <g transform="translate(256, 280) scale(1.0)" filter="url(#glow-green)">
    <path
      d="M 237.4 310 L 258.2 310 Q 274.6 310 283.5 323.8 L 296.3 343.8 Q 326 390 271.1 390 L 130.9 390 Q 76 390 105.7 343.8 L 230.8 149.3 Q 256 110 281.2 149.3 L 436 390"
      fill="none"
      stroke="#5AA788"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round" />
  </g>

  <!-- Agent Connectivity Rays -->
  <circle cx="320" cy="350" r="14" fill="#11161A" stroke="#5AA788" stroke-width="4" />
  <circle cx="704" cy="350" r="14" fill="#11161A" stroke="#5AA788" stroke-width="4" />
  <circle cx="320" cy="730" r="14" fill="#11161A" stroke="#5AA788" stroke-width="4" />
  <circle cx="704" cy="730" r="14" fill="#11161A" stroke="#5AA788" stroke-width="4" />
</svg>