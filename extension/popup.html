<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ap-browser-connect</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --muted: GrayText;
        --accent: #5aa788;
        --border: color-mix(in srgb, CanvasText 12%, transparent);
        --card-bg: color-mix(in srgb, Canvas 92%, CanvasText 8%);
      }
      body {
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        margin: 0;
        padding: 16px;
        min-width: 300px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 svg {
        width: 14px;
        height: 14px;
        vertical-align: middle;
      }
      label {
        display: block;
        font-size: 11px;
        color: color-mix(in srgb, CanvasText 58%, transparent);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input[type="text"],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        font-size: 12px;
        margin-bottom: 12px;
      }
      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        user-select: all;
      }
      .annotate-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        margin-bottom: 12px;
      }
      .annotate-btn:hover {
        filter: brightness(1.08);
      }
      .annotate-btn .ab-icon {
        font-size: 13px;
        line-height: 1;
      }
      .annotate-btn .ab-label {
        flex: 1;
        text-align: left;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .annotate-btn kbd {
        font:
          10px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: color-mix(in srgb, white 85%, transparent);
        background: rgba(255, 255, 255, 0.18);
        padding: 3px 5px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .annotate-btn .ab-count {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: #ef4444;
        color: #fff;
        font:
          700 10px/18px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        text-align: center;
      }
      .status {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .status-line {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-line strong {
        color: var(--fg);
        font-weight: 500;
      }
      .status .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.connected {
        background: var(--accent);
      }
      .dot.disconnected {
        background: #f87171;
      }
      .dot.idle {
        background: var(--muted);
      }
      .copy-btn {
        padding: 2px 6px;
        font-size: 10px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        flex-shrink: 0;
        cursor: pointer;
        border-radius: 4px;
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .settings-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        padding: 3px 6px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .settings-btn:hover {
        color: var(--fg);
        border-color: var(--accent);
      }
      .settings-panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .full-options-link {
        display: inline-block;
        font-size: 11px;
        color: var(--accent);
        text-decoration: none;
        margin-top: 4px;
        cursor: pointer;
      }
      .full-options-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="header-row">
      <h1>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <defs>
            <linearGradient
              id="ap-bg"
              x1="0"
              y1="0"
              x2="16"
              y2="16"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#313b42" />
              <stop offset="1" stop-color="#242b30" />
            </linearGradient>
          </defs>
          <rect width="16" height="16" rx="3" fill="url(#ap-bg)" />
          <g transform="translate(2.88 3.00) scale(0.020)">
            <path
              d="M 237.4 310 L 258.2 310 Q 274.6 310 283.5 323.8 L 296.3 343.8 Q 326 390 271.1 390 L 130.9 390 Q 76 390 105.7 343.8 L 230.8 149.3 Q 256 110 281.2 149.3 L 436 390"
              fill="none"
              stroke="#5aa788"
              stroke-width="70"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
        </svg>
        AP Browser Connect
      </h1>
      <button class="settings-btn" id="settingsBtn" title="Toggle Settings">
        ⚙ Settings
      </button>
    </div>

    <!-- Inline Expandable Settings Panel -->
    <div class="settings-panel" id="settingsPanel" hidden>
      <label for="agentSelect">Default CLI Agent</label>
      <select id="agentSelect">
        <option value="dsh">DeepSeek Harness (dsh)</option>
        <option value="agent">Cursor CLI Agent (agent)</option>
        <option value="pi">Pi Agent (pi)</option>
        <option value="claude">Claude Code (claude)</option>
        <option value="codex">Codex CLI (codex)</option>
        <option value="gemini">Gemini CLI (gemini)</option>
        <option value="aider">Aider (aider)</option>
        <option value="opencode">OpenCode (opencode)</option>
        <option value="custom">Custom...</option>
      </select>

      <label for="terminalSelect">Default Terminal</label>
      <select id="terminalSelect">
        <option value="auto">Auto (Default / Ghostty / iTerm / WT)</option>
        <option value="ghostty">Ghostty</option>
        <option value="iterm2">iTerm2</option>
        <option value="terminal">Terminal.app</option>
        <option value="wt">Windows Terminal</option>
      </select>

      <label for="workspaceCwd">Default Workspace (CWD)</label>
      <input
        type="text"
        id="workspaceCwd"
        placeholder="Default: ~/.ap-browser/workspace"
      />

      <a class="full-options-link" id="openFullOptionsLink"
        >Open Full Settings Page ↗</a
      >
    </div>

    <label>Annotation</label>
    <button class="annotate-btn" id="annotateBtn">
      <span class="ab-icon">✎</span>
      <span class="ab-label">Toggle annotate</span>
      <kbd id="annotateKbd">⌘⇧E</kbd>
      <span
        class="ab-count"
        id="annotateCount"
        title="elements pinned on the active tab"
        hidden
        >0</span
      >
    </button>

    <label for="label">Profile Label</label>
    <input
      type="text"
      id="label"
      placeholder="e.g. Work, Personal, Side-account…"
      maxlength="32"
    />

    <label>Instance ID</label>
    <div class="row">
      <span class="id" id="instanceId" title="">—</span>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>

    <div class="status">
      <div class="status-line">
        <span class="dot disconnected" id="hostDot"></span>
        <span>host: <strong id="hostState">…</strong></span>
      </div>
      <div class="status-line">
        <span class="dot idle" id="opsDot"></span>
        <span>active ops: <strong id="opsCount">0</strong></span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
