<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-adp" x1="0" y1="0" x2="960" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14191D"/>
      <stop offset="100%" stop-color="#0E1215"/>
    </linearGradient>
    <filter id="shadow-adp" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" rx="16" fill="url(#bg-grad-adp)"/>

  <!-- Left: Main Terminal Running Adapters -->
  <g transform="translate(32, 28)" filter="url(#shadow-adp)">
    <rect width="560" height="384" rx="10" fill="#0F1418" stroke="#2B363F" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="560" height="30" rx="10" fill="#182127"/>
    <circle cx="18" cy="15" r="4.5" fill="#FF5F56"/>
    <circle cx="32" cy="15" r="4.5" fill="#FFBD2E"/>
    <circle cx="46" cy="15" r="4.5" fill="#27C93F"/>
    <text x="280" y="19" font-family="-apple-system, monospace" font-size="11" fill="#94A3B8" text-anchor="middle">terminal — ap-browser adapters</text>

    <!-- Terminal Content -->
    <g transform="translate(18, 48)">
      <!-- Command 1: Twitter -->
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#5AA788">$</text>
      <text x="14" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">ap-browser twitter timeline --limit 2</text>
      
      <!-- Output 1 -->
      <g transform="translate(0, 24)">
        <rect width="524" height="64" rx="6" fill="#141C22" stroke="#22303A" stroke-width="1"/>
        <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10.5" fill="#38BDF8">@sama</text>
        <text x="56" y="18" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">· 2h ago</text>
        <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10.5" fill="#E2E8F0">"super excited about the progress we're making on voice agents..."</text>
        <text x="12" y="52" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">1.4K replies · 3.8K reposts · 24K likes [Profile: Default Chrome]</text>
      </g>

      <!-- Command 2: GitHub -->
      <g transform="translate(0, 110)">
        <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#5AA788">$</text>
        <text x="14" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">ap-browser github repo-pulls rust-lang/rust --state open --limit 2</text>
        
        <!-- Output 2 -->
        <g transform="translate(0, 24)">
          <rect width="524" height="64" rx="6" fill="#141C22" stroke="#22303A" stroke-width="1"/>
          <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10.5" fill="#34D399">#128492 [OPEN]</text>
          <text x="110" y="18" font-family="ui-monospace, monospace" font-size="10.5" fill="#E2E8F0">Optimize borrowck path verification algorithm</text>
          <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">Author: compiler-team · Labels: [T-compiler, performance] · Comments: 18</text>
          <text x="12" y="52" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">Updated: 14m ago · CI: all checks passing</text>
        </g>
      </g>

      <!-- Command 3: Hacker News -->
      <g transform="translate(0, 220)">
        <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#5AA788">$</text>
        <text x="14" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">ap-browser hackernews top --limit 1</text>
        <g transform="translate(0, 24)">
          <rect width="524" height="48" rx="6" fill="#141C22" stroke="#22303A" stroke-width="1"/>
          <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10.5" fill="#FB923C">1.</text>
          <text x="28" y="18" font-family="ui-monospace, monospace" font-size="10.5" fill="#E2E8F0">Show HN: Autopoies Browser Connect (github.com)</text>
          <text x="12" y="36" font-family="ui-monospace, monospace" font-size="9.5" fill="#94A3B8">342 points by maolon 3 hours ago | 98 comments</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Supported Adapters Grid / Badge Card -->
  <g transform="translate(620, 28)" filter="url(#shadow-adp)">
    <rect width="308" height="384" rx="10" fill="#161E24" stroke="#2B363F" stroke-width="1.5"/>
    
    <g transform="translate(20, 24)">
      <!-- Header -->
      <text x="0" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">43+ Site Adapters</text>
      <text x="0" y="34" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94A3B8">159 pre-built, ready-to-run commands</text>

      <line x1="0" y1="46" x2="268" y2="46" stroke="#26333D" stroke-width="1"/>

      <!-- Category 1 -->
      <g transform="translate(0, 60)">
        <text x="0" y="12" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5AA788">SOCIAL &amp; MEDIA</text>
        <g transform="translate(0, 20)">
          <!-- Badges -->
          <rect x="0" y="0" width="76" height="22" rx="4" fill="#202A32"/>
          <text x="38" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Twitter / X</text>

          <rect x="84" y="0" width="60" height="22" rx="4" fill="#202A32"/>
          <text x="114" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Reddit</text>

          <rect x="152" y="0" width="64" height="22" rx="4" fill="#202A32"/>
          <text x="184" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">YouTube</text>

          <rect x="0" y="28" width="60" height="22" rx="4" fill="#202A32"/>
          <text x="30" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Bilibili</text>

          <rect x="68" y="28" width="56" height="22" rx="4" fill="#202A32"/>
          <text x="96" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Zhihu</text>

          <rect x="132" y="28" width="84" height="22" rx="4" fill="#202A32"/>
          <text x="174" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">HackerNews</text>
        </g>
      </g>

      <!-- Category 2 -->
      <g transform="translate(0, 140)">
        <text x="0" y="12" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5AA788">WORK &amp; CODE</text>
        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="62" height="22" rx="4" fill="#202A32"/>
          <text x="31" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">GitHub</text>

          <rect x="70" y="0" width="56" height="22" rx="4" fill="#202A32"/>
          <text x="98" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">GitLab</text>

          <rect x="134" y="0" width="56" height="22" rx="4" fill="#202A32"/>
          <text x="162" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Notion</text>

          <rect x="198" y="0" width="46" height="22" rx="4" fill="#202A32"/>
          <text x="221" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Jira</text>

          <rect x="0" y="28" width="64" height="22" rx="4" fill="#202A32"/>
          <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Linear</text>

          <rect x="72" y="28" width="60" height="22" rx="4" fill="#202A32"/>
          <text x="102" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Vercel</text>

          <rect x="140" y="28" width="70" height="22" rx="4" fill="#202A32"/>
          <text x="175" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Discord</text>
        </g>
      </g>

      <!-- Bottom Feature Box -->
      <g transform="translate(0, 224)">
        <rect width="268" height="96" rx="8" fill="#12181C" stroke="#253530" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5AA788">✓ Zero Setup &amp; No API Keys</text>
        <text x="12" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8">Runs through your active Chrome tab.</text>
        <text x="12" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8">YAML schema + custom JS hooks.</text>
        <text x="12" y="76" font-family="-apple-system, monospace" font-size="9.5" fill="#5AA788">~/.ap-browser/sites/*.yaml</text>
      </g>
    </g>
  </g>
</svg>
